name: Deploy para Hostinger (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Pasta no servidor onde o site é servido.
          # Hostinger: normalmente "/public_html/". Se a sua conta FTP
          # já abre dentro de public_html, troque para "./".
          server-dir: /public_html/
          # Envia a raiz do repositório, exceto o que não deve ir ao ar:
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
